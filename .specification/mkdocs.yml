site_name: "spec-weaver Spec"
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
extra_javascript:
    - javascripts/custom-table-filter.js
extra_css:
    - stylesheets/extra.css
nav:
  - Home: index.md
  - AUT:
      - AUT一覧: aut.md
      - AUT-001: items/AUT-001.md
      - AUT-002: items/AUT-002.md
      - AUT-003: items/AUT-003.md
      - AUT-004: items/AUT-004.md
  - CORE:
      - CORE一覧: core.md
      - CORE-001: items/CORE-001.md
      - CORE-999: items/CORE-999.md
      - CORE-003: items/CORE-003.md
