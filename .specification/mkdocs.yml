      - VIS-004: items/VIS-004.md
      - VIS-005: items/VIS-005.md
      - VIS-006: items/VIS-006.md
      - VIS-007: items/VIS-007.md
      - VIS-008: items/VIS-008.md

  - 振る舞い仕様 (Features):
      - features/index.md

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
