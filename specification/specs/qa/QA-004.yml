text: |
  ## 概要
  指定した `.feature` ファイルの構造コンテンツ（Feature / Background / Scenario）の
  SHA-256 ハッシュを計算し、ファイル先頭にコメントとして書き込む `review` コマンドの仕様。
  これにより、ファイルが最後にレビューされた時点の状態を `.feature` ファイル自身が記録する。

  ## コマンド形式

  ```
  spec-weaver review <FEATURE_FILE_PATH>
  ```

  ### 引数
  - `<FEATURE_FILE_PATH>` (必須): レビュー対象の `.feature` ファイルパス

  ## 処理

  1. 指定された `.feature` ファイルを Gherkin パーサーで解析する。
  2. Feature / Background / 全 Scenario の構造コンテンツ（keyword, name, steps, examples）を
     連結して SHA-256 ハッシュを計算する。
     - ハッシュ計算の対象: Feature の keyword・name・description、Background の steps、
       各 Scenario の name・keyword・steps・examples テーブル
     - ハッシュ計算の **除外対象**: ファイル先頭の `# spec-weaver-fingerprint:` コメント行
  3. ファイルの先頭行に `# spec-weaver-fingerprint: <sha256>` の形式でコメントを書き込む。
     - 既存のコメントがある場合は上書き更新する。
     - コメントがない場合は先頭に挿入する。

  ## コメント形式

  ```gherkin
  # spec-weaver-fingerprint: abc123def456...
  @QA-004
  Feature: ...
  ```

  ## 出力
  - 成功時: 書き込んだファイルパスとハッシュ値を表示する
  - 指定ファイルが存在しない: エラーメッセージを表示し終了コード 1 を返す
  - 指定ファイルが `.feature` でない: エラーメッセージを表示し終了コード 1 を返す

  ## 関連コマンドとの役割分担
  - `spec-weaver review <feature_file>`: `.feature` ファイル自身のレビュー状態を記録する（本仕様）
  - `spec-weaver clear <SPEC_ID>`: Doorstop アイテムが現在の Gherkin 内容を把握済みであることを記録する（QA-005）
