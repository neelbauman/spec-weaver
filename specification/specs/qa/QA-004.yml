text: |
  ## 概要
  Doorstop アイテムを指定し、suspect の原因となった関連アイテムをエディタで開いて確認した上で
  `reviewed` スタンプを更新する `review` コマンドの仕様。
  `.feature` ファイルは BDD アイテムから自動生成される対象であるため、直接レビューしない。

  ## コマンド形式

  ```
  spec-weaver review <ITEM_ID> [OPTIONS]
  spec-weaver review --all [OPTIONS]
  ```

  ### 引数
  - `<ITEM_ID>` (必須、`--all` との排他): レビュー対象の Doorstop アイテム ID（例: `QA-001`）

  ### オプション
  - `--no-edit`: エディタを開かずにレビューする（CI / 自動化向け）
  - `--all`: 全アクティブ Doorstop アイテムを一括レビューする（エディタなし・`--no-edit` 相当）
  - `--repo-root <path>`: Doorstop プロジェクトルート（デフォルト: カレントディレクトリ）

  ## 処理（単一アイテム）

  1. 指定アイテムの YAML ファイルパスを取得する。
  2. `suspect_causes` から原因ファイル（親 YAML または .feature）を特定する。
  3. `--no-edit` が指定されていない場合:
     a. suspect の原因となった親アイテムの YAML パスを収集する。
     b. エディタを分割表示で起動する:
        - vim / nvim / vi / view / gvim:
          `-O <target.yml> <related1.yml> <related2.yml> ...`
          で縦分割（対象 YAML と関連アイテムを並べて表示）
        - それ以外のエディタ: 対象 YAML と関連アイテムをまとめて開く
     c. エディタが終了コード 0 以外で終了した場合はエラーにして中断する。
  4. Doorstop の `item.review()` を呼び出して `reviewed` スタンプを更新する。

  ## 処理（--all モード）

  1. 全アクティブ Doorstop アイテムに対して `item.clear()` → `item.review()` を実行する。
  2. エディタは開かない（`--no-edit` 相当）。
  3. 処理結果（成功件数・失敗件数）を表示する。

  ## 出力
  - 成功時: レビュー済みアイテム ID を表示する
  - エディタが見つからない: エラーメッセージを表示し終了コード 1 を返す
  - エディタが非ゼロ終了した: エラーメッセージを表示し終了コード 1 を返す
  - 指定アイテムが見つからない: エラーメッセージを表示し終了コード 1 を返す
  - `--all` と `<ITEM_ID>` を同時指定: エラーメッセージを表示し終了コード 1 を返す
  - どちらも未指定: エラーメッセージを表示し終了コード 1 を返す

  ## 関連コマンドとの役割分担
  - `spec-weaver review <ITEM_ID>`: Doorstop アイテムをエディタで確認してレビュー済みにする（本仕様）
  - `spec-weaver clear <ITEM_ID>`: Doorstop アイテムの Gherkin フィンガープリントをエディタで確認して更新する（QA-005）
