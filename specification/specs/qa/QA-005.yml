text: |
  ## 概要
  Doorstop アイテムを指定し、`gherkin_fingerprints` の不一致を引き起こした Gherkin ファイルを
  エディタで開いて確認した上で `gherkin_fingerprints` を更新し Suspect 状態を解除する `clear` コマンドの仕様。
  `.feature` ファイルは BDD アイテムから自動生成される対象であるため、`.feature` ファイルパスの直接指定は行わない。

  ## コマンド形式

  ```
  spec-weaver clear <ITEM_ID> [OPTIONS]
  spec-weaver clear --all [OPTIONS]
  ```

  ### 引数
  - `<ITEM_ID>` (必須、`--all` との排他): クリア対象の Doorstop アイテム ID（例: `QA-001`）

  ### オプション
  - `--no-edit`: エディタを開かずにクリアする（CI / 自動化向け）
  - `--all`: `gherkin_fingerprints` が不一致の全アイテムを一括クリアする（エディタなし・`--no-edit` 相当）
  - `--repo-root <path>`: Doorstop プロジェクトルート（デフォルト: カレントディレクトリ）

  ## 処理（単一アイテム）

  1. 指定アイテムの YAML ファイルパスを取得する。
  2. `suspect_causes` から `gherkin_fingerprints` の不一致を引き起こした .feature ファイルパスを特定する。
  3. `--no-edit` が指定されていない場合:
     a. `gherkin_fingerprints` の不一致を引き起こした .feature ファイルパスを収集する。
     b. エディタを分割表示で起動する:
        - vim / nvim / vi / view / gvim:
          `-O <target.yml> <feature1.feature> <feature2.feature> ...`
          で縦分割（対象 YAML と関連 Gherkin を並べて表示）
        - それ以外のエディタ: 対象 YAML と関連 Gherkin をまとめて開く
     c. エディタが終了コード 0 以外で終了した場合はエラーにして中断する。
  4. 指定アイテムに紐づく Gherkin シナリオのフィンガープリント（SHA-256）をファイル単位で計算する。
  5. 該当する Doorstop YAML の `gherkin_fingerprints` フィールドを新しいハッシュ値リストで上書きする。
  6. Doorstop ネイティブの suspect リンクも解除する。

  ## 処理（--all モード）

  1. `gherkin_fingerprints` が不一致の全アイテムを対象とする。
  2. エディタは開かない（`--no-edit` 相当）。
  3. 未レビューアイテムはスキップし警告を表示する。
  4. 更新件数・スキップ件数を表示する。

  ## 出力
  - 成功時: 更新されたアイテム ID とフィンガープリントのサマリーを表示する
  - エディタが見つからない: エラーメッセージを表示し終了コード 1 を返す
  - エディタが非ゼロ終了した: エラーメッセージを表示し終了コード 1 を返す
  - 対象なし: 警告メッセージを表示し終了コード 1 を返す
  - 存在しないアイテム ID: エラーメッセージを表示し終了コード 1 を返す
  - 未レビューアイテム（単一指定）: エラーメッセージを表示し終了コード 1 を返す
  - `--all` と `<ITEM_ID>` を同時指定: エラーメッセージを表示し終了コード 1 を返す

  ## 関連コマンドとの役割分担
  - `spec-weaver review <ITEM_ID>`: Doorstop アイテムをエディタで確認してレビュー済みにする（QA-004）
  - `spec-weaver clear <ITEM_ID>`: Doorstop アイテムの Gherkin フィンガープリントをエディタで確認して更新する（本仕様）
